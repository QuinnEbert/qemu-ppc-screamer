name: macOS Universal Build

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build-x86_64:
    name: Build x86_64
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (brew)
        run: |
          brew update
          brew install meson ninja pkg-config glib pixman libslirp

      - name: Prepare Python deps
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user tomli distlib

      - name: Configure + Build (x86_64)
        env:
          CFLAGS: "-arch x86_64"
          LDFLAGS: "-arch x86_64"
        run: |
          ./configure --target-list=ppc-softmmu --disable-werror --disable-fuse --disable-fuse-lseek --enable-slirp --enable-coreaudio
          ninja -C build qemu-system-ppc
          mv build/qemu-system-ppc qemu-system-ppc-x86_64

      - name: Upload artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ppc-x86_64
          path: qemu-system-ppc-x86_64

  build-arm64:
    name: Build arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (brew)
        run: |
          brew update
          brew install meson ninja pkg-config glib pixman libslirp

      - name: Prepare Python deps
        run: |
          python3 -m pip install --user --upgrade pip --break-system-packages || true
          python3 -m pip install --user tomli distlib --break-system-packages

      - name: Configure + Build (arm64)
        env:
          CFLAGS: "-arch arm64"
          LDFLAGS: "-arch arm64"
        run: |
          ./configure --target-list=ppc-softmmu --disable-werror --disable-fuse --disable-fuse-lseek --enable-slirp --enable-coreaudio
          ninja -C build qemu-system-ppc
          mv build/qemu-system-ppc qemu-system-ppc-arm64

      - name: Upload artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ppc-arm64
          path: qemu-system-ppc-arm64

  universal:
    name: Make universal + Release
    needs: [build-x86_64, build-arm64]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: qemu-ppc-x86_64
          path: artifacts

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: qemu-ppc-arm64
          path: artifacts

      - name: Create universal2 binary
        run: |
          # Create universal binary
          lipo -create artifacts/qemu-system-ppc-x86_64 artifacts/qemu-system-ppc-arm64 -output qemu-system-ppc-universal
          chmod +x qemu-system-ppc-universal

          # Layout ZIP so it unpacks flat with bin/ and share/
          # Binary goes under bin/ so relocatable lookup finds ../share/qemu
          mkdir -p bin share/qemu
          mv qemu-system-ppc-universal bin/
          rsync -a --delete pc-bios/ share/qemu/

          # Package universal zip with flat layout (no extra top-level folder)
          zip -9 -r qemu-system-ppc-universal.zip bin share

          # Also package per-arch binaries for convenience (no bundle)
          zip -9 qemu-system-ppc-x86_64.zip artifacts/qemu-system-ppc-x86_64
          zip -9 qemu-system-ppc-arm64.zip artifacts/qemu-system-ppc-arm64

      - name: Set release metadata
        shell: bash
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "RELEASE_TAG=${BRANCH}-${TS}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Build ${BRANCH} ${TS} (${SHORT_SHA})" >> $GITHUB_ENV
          echo "RELEASE_BODY=Automated universal macOS build\\n\\nBranch: ${GITHUB_REF_NAME}\\nCommit: ${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            qemu-system-ppc-universal.zip
            qemu-system-ppc-x86_64.zip
            qemu-system-ppc-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

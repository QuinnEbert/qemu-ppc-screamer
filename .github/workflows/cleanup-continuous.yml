name: Cleanup Continuous Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete 'continuous' release and tag
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag if present
        run: |
          echo "Checking for 'continuous' release..."
          gh release view continuous >/dev/null 2>&1 && {
            echo "Found. Deleting release + tag...";
            gh release delete continuous -y --cleanup-tag || true;
          } || echo "No 'continuous' release found."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
